[package]
name = "wonderd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wonderd"
path = "src/main.rs"

[features]
experimental-relay = ["dep:wonder-relay", "dep:tower"]

[dependencies]
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
base64.workspace = true
hex.workspace = true
libc = "0.2"
time.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tempfile.workspace = true
uuid.workspace = true
wonder-harness = { path = "../wonder-harness" }
wonder-api = { path = "../wonder-api" }
wonder-app-server = { path = "../wonder-app-server" }
wonder-asr = { path = "../wonder-asr" }
wonder-store = { path = "../wonder-store" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
wonder-relay = { path = "../wonder-relay", optional = true }
tower = { workspace = true, optional = true }

jsonschema = { version = "0.53.0", default-features = false }

[dev-dependencies]
p256.workspace = true
tower.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29.0"
