[package]
autobins = false
name = "wonder-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Keep the desktop graphics dependency graph out of daemon/mobile builds.
[workspace]

[profile.dev]
debug = "line-tables-only"
incremental = false

[[bin]]
name = "wonder-host"
path = "src/host.rs"

[dependencies]
gpui-kit = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"
