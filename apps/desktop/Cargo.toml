[package]
name = "wonder-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Keep the desktop graphics dependency graph out of daemon/mobile builds.
[workspace]

[profile.dev]
debug = "line-tables-only"
incremental = false

[features]
default = ["chats"]
chats = []

[[bin]]
name = "wonder-desktop"
path = "src/main.rs"
required-features = ["chats"]

[[bin]]
name = "wonder-host"
path = "src/host.rs"

[dependencies]
gpui-kit = "=0.6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
markdown = "=1.0.0"
chrono = "0.4"
chrono-tz = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"
